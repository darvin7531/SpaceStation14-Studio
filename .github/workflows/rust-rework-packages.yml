name: Rust Rework Installer Packages

# Build actual downloadable installers only when packaging changes, on an
# explicit manual request, or for a named Rust rework tag. They are unsigned
# test artifacts, NOT automatic published releases.
on:
  workflow_dispatch:
  push:
    branches:
      - rework/rust-tauri
    tags:
      - 'rust-rework-v*'
    paths:
      - '.github/workflows/rust-rework-packages.yml'
      - 'src-tauri/tauri.bundle.conf.json'
      - 'src-tauri/tauri.windows.bundle.conf.json'

permissions:
  contents: read

concurrency:
  group: rust-rework-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate frontend before building installers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run UI regression tests
        run: npm test
      - name: Verify TypeScript and Vite bundle
        run: npm run build:web

  linux:
    name: Build Linux deb + AppImage installers
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate icons from canonical PNG
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Linux installation packages
        run: npm run build -- --config src-tauri/tauri.bundle.conf.json --bundles deb,appimage
      - name: Publish Linux package artifacts (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ss14-studio-rust-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Build Windows NSIS + MSI installers
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Windows ICO and other icons
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build Windows installation packages
        run: npm run build -- --config src-tauri/tauri.windows.bundle.conf.json --bundles nsis,msi
      - name: Verify portable Windows executable exists
        shell: pwsh
        run: |
          $binary = "src-tauri/target/release/ss14-studio.exe"
          if (-not (Test-Path $binary -PathType Leaf)) {
            throw "Portable app executable is missing: $binary"
          }
          if ((Get-Item $binary).Length -lt 1MB) {
            throw "Portable executable is unexpectedly small: $binary"
          }
      - name: Publish portable Windows executable (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ss14-studio-rust-windows-portable-x64
          path: src-tauri/target/release/ss14-studio.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish Windows package artifacts (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: ss14-studio-rust-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14

  macos:
    name: Build macOS DMG installer
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Apple ICNS and other icons
        run: npx tauri icon src-tauri/icons/icon.png
      - name: Build macOS DMG
        run: npm run build -- --config src-tauri/tauri.bundle.conf.json --bundles dmg
      - name: Publish macOS DMG artifact (unsigned and unnotarized)
        uses: actions/upload-artifact@v4
        with:
          name: ss14-studio-rust-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
