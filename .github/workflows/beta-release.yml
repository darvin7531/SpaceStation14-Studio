name: Draft beta release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already present in the checked-out app (for example 0.1.5-beta.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest generation
        run: python3 .github/scripts/test-beta-manifest.py
      - name: Validate beta version and signing configuration
        env:
          VERSION: ${{ inputs.version }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUBLIC_KEY: ${{ vars.SS14_STUDIO_UPDATER_PUBKEY }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          version = os.environ['VERSION']
          if not re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)-beta\.(0|[1-9]\d*)', version):
              raise SystemExit('Expected a version like 0.1.5-beta.1')
          for path in ('package.json', 'src-tauri/tauri.conf.json'):
              if json.loads(Path(path).read_text())['version'] != version:
                  raise SystemExit(f'{path} version does not match input')
          if not os.environ['PRIVATE_KEY'] or not os.environ['PUBLIC_KEY']:
              raise SystemExit('Provision TAURI_SIGNING_PRIVATE_KEY and SS14_STUDIO_UPDATER_PUBKEY before running a release')
          PY

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            config: src-tauri/tauri.bundle.conf.json
            bundles: deb,appimage
            files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.sig
          - os: windows-2022
            config: src-tauri/tauri.windows.bundle.conf.json
            bundles: nsis,msi
            files: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.exe.sig
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/msi/*.msi.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install --no-audit --no-fund
      - run: npx tauri icon src-tauri/icons/icon.png
      - name: Build signed updater packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SS14_STUDIO_UPDATER_PUBKEY: ${{ vars.SS14_STUDIO_UPDATER_PUBKEY }}
          VERSION: ${{ inputs.version }}
        run: npm run build -- --config ${{ matrix.config }} --config "{\"version\":\"$VERSION\",\"bundle\":{\"createUpdaterArtifacts\":true}}" --bundles ${{ matrix.bundles }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: beta-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Collect release files
        run: |
          mkdir release-assets
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          for source in Path('artifacts').rglob('*'):
              if source.is_file():
                  destination = Path('release-assets') / source.name
                  if destination.exists():
                      raise SystemExit(f'Duplicate asset: {source.name}')
                  shutil.copyfile(source, destination)
          PY
      - name: Generate and verify manifest
        env:
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/scripts/beta-manifest.py release-assets
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --draft --prerelease --title "SS14 Studio v$VERSION" --notes 'Beta release; review assets before publishing.' release-assets/*
