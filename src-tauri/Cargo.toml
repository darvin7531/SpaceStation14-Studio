[package]
name = "ss14-studio"
version = "0.1.5-beta.1"
description = "Rust rework of the Space Station 14 content editor"
authors = ["darvin7531"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "ss14_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ss14-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2.5"
tauri-plugin-updater = "2.14.1"
yaml-rust2 = "0.13"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
png = "0.17"
fluent-syntax = "0.12.0"
tree-sitter = "0.25"
tree-sitter-c-sharp = "=0.23.5"
notify = "6.1"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_16"] }
