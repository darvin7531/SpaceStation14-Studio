[package]
name = "ss14-studio"
version = "0.1.5-alpha.1"
description = "Rust rework of the Space Station 14 content editor"
authors = ["darvin7531"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "ss14_studio_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ss14-studio"
path = "src/main.rs"

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = "2"
tauri-plugin-dialog = "2"
yaml-rust2 = "0.13"
sha2 = "0.10"
serde_json = "1"
base64 = "0.22"
fluent-syntax = "0.12.0"
